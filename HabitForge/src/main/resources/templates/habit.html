<!DOCTYPE html>
<html>
<head>
    <title>Habit</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h1>Add Habit</h1>

    <input type="text" id="name" placeholder="Habit Name">
    <input type="text" id="frequency" placeholder="Frequency">

    <button onclick="addHabit()">Add Habit</button>

    <h2>Habits</h2>
    <div id="habits"></div>
</div>

<script>
    function addHabit(){

        let habit={
            name:document.getElementById("name").value,
            frequency:document.getElementById("frequency").value
        };

        fetch("/habits",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(habit)
        })
            .then(response=>response.json())
            .then(data=>{
                alert("Habit added");
                loadHabits();
            });
    }

    function loadHabits(){

        fetch("/habits")
            .then(response=>response.json())
            .then(data=>{

                let output="";

                data.forEach(habit=>{
                    output+="<p>"+habit.name+" - "+habit.frequency+"</p>";
                });

                document.getElementById("habits").innerHTML=output;
            });
    }

    loadHabits();
</script>

</body>
</html>
