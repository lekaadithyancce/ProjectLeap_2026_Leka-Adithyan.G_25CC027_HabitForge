<!DOCTYPE html>
<html>
<head>
    <title>Manage Habits - HabitForge</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-box">H</div>
            <div>
                <h2>HabitForge</h2>
                <span>Consistency tracker</span>
            </div>
        </div>

        <div class="nav-title">Menu</div>

        <nav class="nav">
            <a href="/index.html">⌂ Dashboard</a>
            <a href="/habit.html" class="active">✓ Manage Habits</a>
            <a href="/streak.html">🔥 Track Streak</a>
        </nav>

    </aside>

    <main class="main">

        <div class="topbar">
            <div>
                <h1>Manage Habits</h1>
                <p>Create and manage your daily habits.</p>
            </div>
        </div>

        <div class="panel form-panel">

            <div class="panel-header">
                <h2>Create New Habit</h2>
            </div>

            <div class="form-grid">

                <div class="input-group">
                    <label>Habit Name</label>
                    <input
                            type="text"
                            id="name"
                            placeholder="Example: Exercise">
                </div>

                <div class="input-group">
                    <label>Frequency</label>
                    <input
                            type="text"
                            id="frequency"
                            placeholder="Example: Daily">
                </div>

            </div>

            <button class="primary-btn" onclick="addHabit()">
                Add Habit
            </button>

        </div>

        <div class="panel" style="margin-top:22px;">

            <div class="panel-header">
                <h2>My Habits</h2>
            </div>

            <div id="habits"></div>

        </div>

        <a class="back" href="/index.html">
            ← Back to Dashboard
        </a>

    </main>

</div>

<script>

    function addHabit() {

        let name=document.getElementById("name").value;
        let frequency=document.getElementById("frequency").value;

        if(name===""||frequency==="") {
            alert("Please enter habit name and frequency");
            return;
        }

        let habit={
            name:name,
            frequency:frequency
        };

        fetch("/habits",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(habit)
        })
            .then(response=>response.json())
            .then(data=>{

                alert("Habit added successfully");

                document.getElementById("name").value="";
                document.getElementById("frequency").value="";

                loadHabits();
            });
    }

    function loadHabits() {

        fetch("/habits")
            .then(response=>response.json())
            .then(data=>{

                let output="";

                if(data.length===0) {
                    output="<p style='color:#8b93a7;'>No habits added yet.</p>";
                }

                data.forEach(habit=>{

                    output += `
                <div class="habit-row">

                    <div class="habit-left">

                        <div class="habit-icon">
                            ✓
                        </div>

                        <div>
                            <div class="habit-name">
                                ${habit.name}
                            </div>

                            <div class="habit-meta">
                                ${habit.frequency}
                            </div>
                        </div>

                    </div>

                    <span style="color:#67e8f9;">
                        Active
                    </span>

                </div>
            `;
                });

                document.getElementById("habits").innerHTML=output;
            });
    }

    loadHabits();

</script>

</body>
</html>
