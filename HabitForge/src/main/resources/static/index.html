<!DOCTYPE html>
<html>
<head>
    <title>HabitForge</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
    <h1>HabitForge</h1>
    <p>Build habits. Track progress. Stay consistent.</p>
</header>

<div class="container">

    <div class="stats">
        <div class="card">
            <h2>5</h2>
            <p>Total Habits</p>
        </div>

        <div class="card">
            <h2>12</h2>
            <p>Current Streak</p>
        </div>

        <div class="card">
            <h2>25</h2>
            <p>Best Streak</p>
        </div>
    </div>

    <div class="menu">
        <a href="/habit.html">Manage Habits</a>
        <a href="/streak.html">Track Streak</a>
    </div>

    <div class="habit-list">
        <h2>Today's Habits</h2>

        <div class="habit">
            <span>Drink Water</span>
            <button>Completed</button>
        </div>

        <div class="habit">
            <span>Exercise</span>
            <button>Complete</button>
        </div>

        <div class="habit">
            <span>Read Book</span>
            <button>Complete</button>
        </div>
    </div>

</div>

</body>
</html>
